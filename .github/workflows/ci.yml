name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    # 约束语义测试需要真实 PostgreSQL（InMemory 不强制唯一索引/外键，SQLite 的
    # EnsureCreated 也拿不到写在迁移里的原生 SQL 索引）。由 runner 提供服务容器，
    # 而不是让测试进程自己去起容器——后者要求进程能直连 Docker daemon，不可靠。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ratools_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ratools_tests"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Repository hygiene
        run: |
          python3 scripts/tests/test_repository_hygiene.py
          python3 scripts/tests/test_database_migration_contract.py
          python3 scripts/tests/test_publisher_reference_contract.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/RATools.Tests/RATools.Tests.csproj

      - name: Build
        run: dotnet build tests/RATools.Tests/RATools.Tests.csproj --configuration Release --no-restore

      - name: Run database migrator twice
        run: |
          dotnet run --project src/RATools.DatabaseMigrator/RATools.DatabaseMigrator.csproj --configuration Release --no-build
          dotnet run --project src/RATools.DatabaseMigrator/RATools.DatabaseMigrator.csproj --configuration Release --no-build
        env:
          ConnectionStrings__PostgreSql: Host=localhost;Port=5432;Database=ratools_tests;Username=postgres;Password=postgres

      - name: Test
        run: dotnet test tests/RATools.Tests/RATools.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=backend.trx" --results-directory ./TestResults
        env:
          RATOOLS_TEST_POSTGRES: Host=localhost;Port=5432;Database=ratools_tests;Username=postgres;Password=postgres

      - name: Regional FDA and EU regression
        run: >-
          dotnet test tests/RATools.Tests/RATools.Tests.csproj
          --configuration Release --no-build
          --filter "FullyQualifiedName~RATools.Tests.Publishing.UsRegional|FullyQualifiedName~RATools.Tests.Publishing.EuRegional"

      # 测试失败时把失败用例名与消息打进日志——否则只剩 "exit code 1"，
      # 而 job 日志需要仓库 admin 权限才能下载，排障会卡在拿不到信息上。
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}


          def text_of(result, tag):
              node = result.find(f'.//t:{tag}', ns)
              return node.text.strip() if node is not None and node.text else ''


          for path in glob.glob('TestResults/*.trx'):
              for result in ET.parse(path).getroot().findall('.//t:UnitTestResult', ns):
                  if result.get('outcome') != 'Failed':
                      continue
                  name = result.get('testName')
                  detail = '\n'.join(filter(None, (text_of(result, 'Message'), text_of(result, 'StackTrace'))))
                  print(f'--- FAILED: {name}\n{detail}\n')
                  # Put the detail in the annotation body: annotations are readable
                  # without repository admin rights, whereas job logs are not.
                  escaped = detail[:2000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::error title={name}::{escaped}')
          PY

      # 契约测试：守护 PublishJobsController 特性、RATools.Api.http 与 README 三方一致，
      # 防止端点契约与文档静默漂移（此前该脚本从未在 CI 执行，文档已漂移过一次）。
      - name: Publish jobs contract test
        run: python3 scripts/tests/test_publish_jobs_controller_contract.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: ./TestResults

  path-security:
    name: Path security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/RATools.Tests/RATools.Tests.csproj

      - name: Build
        run: dotnet build tests/RATools.Tests/RATools.Tests.csproj --configuration Release --no-restore

      - name: Run adversarial path matrix
        run: dotnet test tests/RATools.Tests/RATools.Tests.csproj --configuration Release --no-build --filter "Category=PathSecurity" --logger "console;verbosity=minimal"

  frontend:
    name: Frontend (lint, build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI contract drift
        run: npm run api:check

      - name: Lint
        run: npm run lint

      - name: Build and enforce bundle budget
        run: npm run build

      - name: Test
        run: npm test

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Image contract
        run: |
          python3 scripts/tests/test_production_image_contract.py
          python3 scripts/tests/test_production_deployment_contract.py
          python3 scripts/tests/test_backup_restore_contract.py
          python3 scripts/tests/test_release_contract.py

      - name: Initialize deployment secrets
        run: python3 scripts/initialize_production.py

      - name: Validate production Compose
        run: docker compose -f compose.production.yml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --volume "$PWD/deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate Prometheus configuration and alerts
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/deploy/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          --volume "$PWD/deploy/production/alerts.yml:/etc/prometheus/rules/alerts.yml:ro"
          prom/prometheus:v3.13.2
          check config /etc/prometheus/prometheus.yml

      - name: Build production image
        id: release_metadata
        run: |
          version=$(tr -d '\r\n' < VERSION)
          build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          build_args=(
            --build-arg "APP_VERSION=$version"
            --build-arg "VCS_REF=$GITHUB_SHA"
            --build-arg "BUILD_DATE=$build_date"
          )
          docker build --pull "${build_args[@]}" --target migrator --tag ratools-migrator:ci .
          docker build --pull "${build_args[@]}" --tag ratools:ci .
          docker tag ratools-migrator:ci ratools-migrator:local
          docker tag ratools:ci ratools:local
          echo "RATOOLS_VERSION=$version" >> "$GITHUB_ENV"
          echo "RATOOLS_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "RATOOLS_BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify non-root runtime and frontend artifact
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ratools:ci)" != "0"
          test "$(docker image inspect --format '{{.Config.User}}' ratools-migrator:ci)" != "0"
          for image in ratools:ci ratools-migrator:ci; do
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$RATOOLS_VERSION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$RATOOLS_REVISION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "$image")" = "$RATOOLS_BUILD_DATE"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image")" = "AGPL-3.0-only"
          done
          container_id=$(docker create ratools:ci)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/app/wwwroot/index.html" ./image-index.html
          docker cp "$container_id:/app/reference/dtd/ich-ectd-3-2.dtd" ./image-ich-ectd-3-2.dtd
          test -s ./image-index.html
          test -s ./image-ich-ectd-3-2.dtd
          if docker cp "$container_id:/app/appsettings.Development.json" ./unexpected-development-settings.json 2>/dev/null; then
            echo "appsettings.Development.json must not be present in the production image"
            exit 1
          fi

      - name: Prepare SBOM output
        run: mkdir -p .artifacts/sbom

      - name: Generate source dependency SBOM
        uses: anchore/sbom-action@v0.24.0
        env:
          SYFT_SOURCE_NAME: RATools-for-eCTD-source
          SYFT_SOURCE_VERSION: ${{ steps.release_metadata.outputs.version }}
        with:
          path: .
          config: .syft.yaml
          format: cyclonedx-json
          output-file: .artifacts/sbom/ratools-source.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate runtime image SBOM
        uses: anchore/sbom-action@v0.24.0
        env:
          SYFT_SOURCE_NAME: RATools-for-eCTD-image
          SYFT_SOURCE_VERSION: ${{ steps.release_metadata.outputs.version }}
        with:
          image: ratools:ci
          config: .syft.yaml
          format: cyclonedx-json
          output-file: .artifacts/sbom/ratools-image.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate migration image SBOM
        uses: anchore/sbom-action@v0.24.0
        env:
          SYFT_SOURCE_NAME: RATools-for-eCTD-migrator
          SYFT_SOURCE_VERSION: ${{ steps.release_metadata.outputs.version }}
        with:
          image: ratools-migrator:ci
          config: .syft.yaml
          format: cyclonedx-json
          output-file: .artifacts/sbom/ratools-migrator.cdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Validate and package release evidence
        run: |
          python3 scripts/validate_release_artifacts.py \
            --source-sbom .artifacts/sbom/ratools-source.cdx.json \
            --image-sbom .artifacts/sbom/ratools-image.cdx.json \
            --migrator-sbom .artifacts/sbom/ratools-migrator.cdx.json \
            --checksums .artifacts/sbom/SHA256SUMS
          {
            echo "version=$RATOOLS_VERSION"
            echo "revision=$RATOOLS_REVISION"
            echo "created=$RATOOLS_BUILD_DATE"
            echo "api_image=$(docker image inspect --format '{{.Id}}' ratools:ci)"
            echo "migrator_image=$(docker image inspect --format '{{.Id}}' ratools-migrator:ci)"
          } > .artifacts/sbom/build-metadata.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: ratools-${{ steps.release_metadata.outputs.version }}-${{ github.sha }}-sbom
          path: |
            .artifacts/sbom
            VERSION
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 90

      - name: Run production backup and isolated restore drill
        run: |
          docker compose -f compose.production.yml up --detach --no-build
          ready=false
          for attempt in {1..60}; do
            if curl --insecure --fail --silent --show-error https://localhost/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose -f compose.production.yml ps
            docker compose -f compose.production.yml logs
            exit 1
          fi
          curl --insecure --fail --silent --show-error https://localhost/version \
            | python3 -c 'import json, sys; payload = json.load(sys.stdin); assert payload["version"].startswith(sys.argv[1])' "$RATOOLS_VERSION"
          docker compose -f compose.production.yml exec -T postgres psql \
            --username=ratools --dbname=ratools --set=ON_ERROR_STOP=1 \
            --command "INSERT INTO audit_logs (\"Id\", \"EntityType\", \"EntityId\", \"Action\", \"Actor\", \"Details\", \"CreatedUtc\") VALUES ('00000000-0000-0000-0000-000000000001', 'BackupDrill', 'ci', 'Seeded', 'system', 'backup restore drill', NOW());"
          docker compose -f compose.production.yml exec -T api sh -c \
            'mkdir -p /data/workspaces/backup-drill && printf "ratools-backup-drill\n" > /data/workspaces/backup-drill/probe.txt'
          python3 scripts/backup_production.py \
            --output-root .artifacts/backup-drill \
            --backup-name ci-drill
          python3 scripts/restore_production_backup.py \
            .artifacts/backup-drill/ci-drill \
            --migrator-image ratools-migrator:local

      - name: Clean up production drill
        if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    env:
      # Force English CLI output so the vulnerability grep is locale-independent.
      DOTNET_CLI_UI_LANGUAGE: en-US
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore tests/RATools.Tests/RATools.Tests.csproj

      # Fail the build only on known-vulnerable NuGet packages (direct or transitive).
      # `dotnet list package --vulnerable` prints "has the following vulnerable
      # packages" when any are found, and "has no vulnerable packages" otherwise.
      - name: Scan NuGet packages for vulnerabilities
        run: |
          set -o pipefail
          report=$(dotnet list tests/RATools.Tests/RATools.Tests.csproj package --vulnerable --include-transitive 2>&1 | tee vulnerable-nuget.txt)
          echo "$report"
          if echo "$report" | grep -qi 'has the following vulnerable packages'; then
            echo "::error::Vulnerable NuGet packages detected. See report above."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Report production-dependency advisories; do not block on dev-only findings.
      - name: Audit npm production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
