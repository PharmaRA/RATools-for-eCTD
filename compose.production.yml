name: ratools-production

services:
  proxy:
    image: caddy:2.11.4-alpine
    user: "65532:65532"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:443:8443"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - ratools_caddy_data:/data
      - ratools_caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost:8443/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16.14-bookworm
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_started
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ratools
      POSTGRES_USER: ratools
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ratools_postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775,uid=999,gid=999
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ratools -d ratools"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migration:
    image: ratools-migrator:local
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    network_mode: "service:proxy"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ConnectionStrings__PostgreSql: Host=127.0.0.1;Port=5432;Database=ratools;Username=ratools
      FileSecrets__PostgreSqlPasswordPath: /run/secrets/postgres_password
    secrets:
      - postgres_password
    tmpfs:
      - /tmp:size=64m,mode=1777

  api:
    image: ratools:local
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "service:proxy"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://127.0.0.1:5000
      Deployment__Containerized: "true"
      Deployment__InstanceLockPath: /app/App_Data/ratools-api.lock
      Persistence__Provider: PostgreSql
      ConnectionStrings__PostgreSql: Host=127.0.0.1;Port=5432;Database=ratools;Username=ratools
      FileSecrets__ApiKeyPath: /run/secrets/api_key
      FileSecrets__PostgreSqlPasswordPath: /run/secrets/postgres_password
      Security__AllowedWorkspaceRoots__0: /app/App_Data
      Security__AllowedWorkspaceRoots__1: /data/workspaces
      Security__AllowDestructiveOperations: "false"
      FileStorage__RootPath: /app/App_Data/uploads
      BackboneOutput__RootPath: /app/App_Data/publish
      Swagger__Enabled: "false"
    secrets:
      - api_key
      - postgres_password
    volumes:
      - ratools_app_data:/app/App_Data
      - ratools_workspaces:/data/workspaces
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 60s

secrets:
  api_key:
    file: ./deploy/production/runtime/secrets/api-key
  postgres_password:
    file: ./deploy/production/runtime/secrets/postgres-password

volumes:
  ratools_postgres_data:
  ratools_app_data:
  ratools_workspaces:
  ratools_caddy_data:
  ratools_caddy_config:
