version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ratools-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ratools
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ratools-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ratools"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ratools-pg-data:
